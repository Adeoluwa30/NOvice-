    <script>
      (function () {
        try {
          var saved = localStorage.getItem("ade-theme");
          var themes = ["dark", "light", "brand"];
          if (saved && themes.indexOf(saved) > -1) {
            document.documentElement.setAttribute("data-theme", saved);
          }
        } catch (e) {}
      })();
    </script>
